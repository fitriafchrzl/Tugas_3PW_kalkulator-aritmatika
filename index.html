<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Aritmatika Pink</title>
  <style>

    :root {
      --primary-pink: #AC3C64; /* Warna pink utama */
      --light-bg: #AC3C64;     /* Latar belakang kalkulator yang lembut */
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      /* Latar belakang halaman berwarna pink muda */
      background-color: var(--light-bg); 
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 300px;
      text-align: center;
    }

    h2 {
      color: var(--primary-pink);
      margin-bottom: 25px;
      font-size: 1.8em;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      color: var(--text-color);
      font-weight: 500;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="number"]:focus {
      border-color: var(--primary-pink);
      outline: none;
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      flex-grow: 1;
      padding: 12px 15px;
      font-size: 1.5em;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--primary-pink);
      color: white;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #7A2846; /* Pink yang sedikit lebih gelap */
    }

    button:active {
      transform: translateY(1px);
    }

    h3 {
      color: var(--text-color);
      font-size: 1.2em;
    }

    #hasil {
      display: block;
      margin-top: 10px;
      font-size: 2em;
      font-weight: bold;
      color: var(--primary-pink);
      background-color: #FAFAF0;
      padding: 10px;
      border-radius: 5px;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Kalkulator Aritmatika Sederhana</h2>

    <div>
      <label for="bil1">Input Bilangan 1:</label>
      <input type="number" id="bil1">
    </div>

    <div>
      <label for="bil2">Input Bilangan 2:</label>
      <input type="number" id="bil2">
    </div>

    <div class="button-group">
      <button onclick="hitung('+')">+</button>
      <button onclick="hitung('-')">−</button>
      <button onclick="hitung('*')">×</button>
      <button onclick="hitung('/')">÷</button>
    </div>

    <h3>Hasil:</h3>
    <span id="hasil">0</span>
  </div>

  <script>

    function hitung(operator) {
      let bil1 = parseFloat(document.getElementById("bil1").value);
      let bil2 = parseFloat(document.getElementById("bil2").value);
      let hasil = 0;


      if (isNaN(bil1) || isNaN(bil2)) {
        document.getElementById("hasil").textContent = "Input Error!";
        alert("Masukkan kedua bilangan terlebih dahulu!");
        return;
      }

      switch (operator) {
        case '+':
          hasil = bil1 + bil2;
          break;
        case '-':
          hasil = bil1 - bil2;
          break;
        case '*':
          hasil = bil1 * bil2;
          break;
        case '/':
          if (bil2 === 0) {
            document.getElementById("hasil").textContent = "Tidak Valid";
            alert("Tidak bisa dibagi dengan nol!");
            return;
          }
          hasil = bil1 / bil2;
          break;
        default:
          return;
      }


      document.getElementById("hasil").textContent = Math.round(hasil * 100000) / 100000;
    }
  </script>
</body>
</html>
