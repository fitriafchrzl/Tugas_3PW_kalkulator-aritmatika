<!DOCTYPE html>
<html>
<head>
<title>Kalkulator Aritmatika Sederhana</title>
<style>
/* --- Bagian CSS untuk Gaya dan Warna --- */
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    /* Latar belakang halaman berwarna Pink */
    background-color: #ffc0cb; /* Warna pink lembut */
    margin: 0;
}

.calculator {
    background-color: #fff0f5; /* Latar belakang kalkulator yang lebih terang */
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    width: 300px;
}

#display {
    width: 100%;
    height: 50px;
    background-color: #f5f5f5;
    border: none;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: right;
    font-size: 2em;
    padding: 10px;
    box-sizing: border-box;
    /* Teks berwarna pink */
    color: #ff69b4; 
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 60px;
    font-size: 1.5em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background-color: #ffb6c1; /* Warna tombol standar: Light Pink */
    color: #4b0082; /* Teks tombol berwarna Indigo */
    transition: background-color 0.1s;
}

button:hover {
    background-color: #ff69b4; /* Warna tombol saat di-hover: Deep Pink */
    color: white;
}

.operator {
    background-color: #ff80ab; /* Warna operator: Pink yang lebih cerah */
    color: white;
}

.equal {
    background-color: #ff1493; /* Warna tombol sama dengan: Deep Pink */
    grid-column: span 2;
    color: white;
}

.clear {
    background-color: #e9967a; /* Warna tombol Hapus: Dark Salmon */
}
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="appendToDisplay('/')">/</button>
        <button class="operator" onclick="appendToDisplay('')"></button>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="operator" onclick="appendToDisplay('-')">-</button>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="operator" onclick="appendToDisplay('+')">+</button>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
// --- Bagian JavaScript untuk Fungsionalitas ---
const display = document.getElementById('display');

// Fungsi untuk menambahkan nilai ke tampilan
function appendToDisplay(value) {
    display.value += value;
}

// Fungsi untuk menghapus tampilan
function clearDisplay() {
    display.value = '';
}

// Fungsi untuk menghitung hasil
function calculate() {
    try {
        // Menggunakan eval() untuk mengevaluasi string ekspresi matematika
        display.value = eval(display.value);
    } catch (error) {
        // Menampilkan pesan error jika terjadi kesalahan perhitungan
        display.value = 'Error';
    }
}
</script>

</body>
</html>
